version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries/*.sql"
    schema: "internal/db/migrations"
    out: "internal/db/sqlc"
    package: "sqlc"
    sql_package: "pgx"
    emit_prepared_queries: true
    emit_interface: true
    emit_exact_table_names: false
    emit_empty_slices: false
    json_tags_case_style: "camel"
